name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockai
          POSTGRES_PASSWORD: stockai
          POSTGRES_DB: stockai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://stockai:stockai@localhost:5432/stockai
      MARKET_DATA_PROVIDER: csv_sample
      SAMPLE_DATA_DIR: ${{ github.workspace }}/data/sample
      UNIVERSE_CONFIG: ${{ github.workspace }}/config/universe.yaml
      TRANSACTION_COST_CONFIG: ${{ github.workspace }}/config/transaction_costs.yaml
      MODEL_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts || true
      - name: Unit & integration tests
        run: pytest -q
      - name: Migrations
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
