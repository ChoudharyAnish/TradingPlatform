[project]
name = "indian-stock-ai"
version = "0.1.0"
description = "Indian equity prediction and trading research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "pandas>=2.2.2",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.1",
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "shap>=0.46.0",
  "joblib>=1.4.2",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "apscheduler>=3.10.4",
  "structlog>=24.4.0",
  "yfinance>=0.2.43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "coverage>=7.6.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
